[package]
name = "rust_enc"
version = "0.1.0"
edition = "2021"

[dependencies]
openh264-rs = { path = "../../../crates/openh264-rs" }

[[bin]]
name = "rust_enc"
path = "main.rs"

[workspace]

# This is a DSP codec, and unoptimised it runs like one: at Cargo's default
# `opt-level = 0` this binary takes 210 ms per configuration against the release
# build's 7.9 ms, and it dominates the wall time of a debug sweep.
#
# Both check flags stay on, and they are the point of a debug run: `overflow-checks`
# turns a C++ signed overflow into a loud Rust panic, and `debug-assertions` keeps the
# `debug_assert!` sites live. They cost about 1.8x — cost worth keeping, and never to be
# traded away for speed.
#
# Safe to live here because `rust_enc` is its own workspace root (the empty
# `[workspace]` above): this governs this crate and its path dependency `openh264-rs`
# only when built through this manifest, and changes nothing about the port crate's own
# `cargo test`.
#
# One consequence, accepted deliberately: at this speed the debug build can reproduce a
# pre-existing multi-threaded slice-list race that `opt-level = 0` hid by being too slow
# to lose it. Debug multi-threaded runs need the same retry allowance as release ones.
[profile.dev]
opt-level = 3
debug-assertions = true
overflow-checks = true

[profile.release]
debug = true

# This driver sets encoder parameters a field at a time, as `cxx_enc.cpp` does.
[lints.clippy]
field_reassign_with_default = "allow"
