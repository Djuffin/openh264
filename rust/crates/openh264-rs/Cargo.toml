[package]
name = "openh264-rs"
version = "0.1.0"
edition = "2024"

# `rlib` is what the tests, benches, examples and `rust_enc` link; `cdylib` is what a
# C consumer `dlopen`s, exporting exactly upstream's seven symbols; `staticlib` is the
# same object set for a consumer that links rather than loads.
[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

# The shipped library has no dependencies. `libc` is a dev-dependency only: its users
# are the two benches, which `dlopen` the C++ dylib to compare against.
[dependencies]
# Off by default, so the shipped library stays dependency-free. `--features wide`
# compiles `src/simd/wide/`, a set of SIMD kernels written against the `wide` crate's
# portable lane types instead of `core::arch` intrinsics, and points `simd::kernels` at
# it so every dispatch site takes the wide kernel — in place of the SSE2 set on x86_64
# and the NEON set on aarch64. The host's intrinsic set is still compiled under the
# feature, which is what lets `benches/kernel_bench.rs` time scalar, intrinsics and wide
# in one binary.
#
# Pinned exactly, because the performance numbers in the README are a claim about a
# particular version: on x86_64 they are `wide`'s SSE2 fallbacks, on aarch64 what LLVM
# lowers its lanes to. The two primitives that would move aarch64 are still absent — no
# absolute-difference/SAD primitive and no rounded byte average — so `sad.rs` pays seven
# ops a row where `psadbw` pays two, and `mc.rs` spells `pavgb` by hand. A release that
# adds either is the one worth re-measuring.
wide = { version = "=1.7.0", optional = true }

[features]
wide = ["dep:wide"]

# The scalar build. The reference has no runtime way to turn its SIMD off, so this is
# that switch: it points `simd::kernels` at `src/simd/scalar/`, which forwards every
# entry point to the scalar body, and clears the feature word so the `pfXxx` tables
# install the scalar directly.
scalar = []

[dev-dependencies]
libc = "0.2"

[[bench]]
name = "c_vs_rust_bench"
harness = false

# Per-kernel scalar / intrinsics / wide timing; the wide column needs `--features wide`.
[[bench]]
name = "kernel_bench"
harness = false

[[bench]]
name = "decode_1080p_bench"
harness = false

# This is a DSP codec, and unoptimised it decodes like one: at Cargo's default
# `opt-level = 0` a single 1280x720 CABAC conformance asset took 62s, and the large
# `VID_*_temporal_direct` streams were the whole of the debug suite's tail. `opt-level =
# 3` cuts that to 4.5s for a few seconds of extra build time.
#
# Both check flags stay on, and they are the reason a debug test run exists at all:
# `overflow-checks` turns a C++ signed overflow into a loud Rust panic, and
# `debug-assertions` keeps the `debug_assert!` sites live. They cost about 1.4x against
# release — cost worth keeping, and never to be traded away for speed.
#
# `[profile.bench]` inherits from `release`, not from here, so benchmark numbers are
# untouched. `rust_enc` is its own workspace root with its own identical profile.
#
# One consequence to watch: a debug build running at near-release speed widens every
# thread window, so a load-sensitive race that the old pace held shut can appear here.
# `multithread_decoder_test` is the exposed surface.
[profile.dev]
opt-level = 3
debug-assertions = true
overflow-checks = true

# Clippy lints that argue with C-shaped code: index loops, wide signatures, C-shaped
# conditionals and declaration-before-assignment.
[lints.clippy]
needless_range_loop = "allow"
collapsible_if = "allow"
too_many_arguments = "allow"
manual_range_contains = "allow"
derivable_impls = "allow"
field_reassign_with_default = "allow"
identity_op = "allow"
missing_safety_doc = "allow"
needless_late_init = "allow"
manual_is_multiple_of = "allow"
int_plus_one = "allow"
explicit_counter_loop = "allow"
neg_multiply = "allow"
if_same_then_else = "allow"
type_complexity = "allow"
# `drop()` here ends a borrow so the next statement can reborrow; the type not
# being Drop is the point, not a mistake.
drop_non_drop = "allow"
# The explicit zero-guard is deliberate; `Result<_, ()>` is right when the only
# failure is an allocation; boxing the big variant adds a per-frame allocation;
# renaming `as_mut` ripples; the literal groupings mark bitstream field edges.
manual_checked_ops = "allow"
result_unit_err = "allow"
large_enum_variant = "allow"
should_implement_trait = "allow"
unusual_byte_groupings = "allow"
